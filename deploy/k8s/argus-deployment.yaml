apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-control-plane
  labels:
    app: vigil-control-plane
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vigil-control-plane
  template:
    metadata:
      labels:
        app: vigil-control-plane
    spec:
      containers:
      - name: vigil-control-plane
        image: vigil/control-plane:v1.0.0
        ports:
        - containerPort: 8080
        - containerPort: 4317
        env:
        - name: VIGIL_REDIS_URL
          value: "redis://vigil-redis:6379"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
